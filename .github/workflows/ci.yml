name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            frontend: false
          - os: ubuntu-latest
            python-version: "3.13"
            frontend: false
          - os: ubuntu-latest
            python-version: "3.11"
            frontend: true
          - os: windows-latest
            python-version: "3.11"
            frontend: true
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[all,dev]"

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Run Python compile check
        shell: bash
        run: |
          find . -path './.venv' -prune -o -path './frontend/node_modules' -prune -o -path './frontend/dist' -prune -o -path './frontend/build' -prune -o -name '*.py' -print0 | xargs -0 python -m py_compile

      - name: Run deterministic system evaluation
        run: python scripts/system_evaluation.py

      - name: Validate Python distribution
        run: |
          python -m build
          python -m twine check dist/*
          python -c "from pathlib import Path; import subprocess, sys; wheel = next(Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)])"
          python -c "from importlib.metadata import entry_points; names = {entry.name for entry in entry_points(group='console_scripts')}; assert {'carry-trade-api', 'carry-trade-model'} <= names"

      - name: Set up Node
        if: matrix.frontend
        uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: matrix.frontend
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        if: matrix.frontend
        working-directory: frontend
        run: npm run build

      - name: Audit all frontend dependencies
        if: matrix.frontend
        working-directory: frontend
        run: npm audit
