name: Bug report
description: Report a reproducible problem in the API, dashboard, data pipeline, or model workflow.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, private datasets, account data, or unpatched vulnerabilities.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest commands and sanitized inputs that reproduce the problem.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Node version, and relevant optional extras.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized output
      render: shell
