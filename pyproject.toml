[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carry-trade-model"
version = "0.1.0"
description = "Research-grade carry trade model, data collectors, API, and dashboard integration."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aidan Marshall" }]
keywords = ["finance", "machine-learning", "research", "time-series", "foreign-exchange"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "flask>=2.3,<4",
  "flask-cors>=4,<7",
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "pandas>=2,<3",
  "python-dotenv>=1,<2",
  "scikit-learn>=1.3,<2",
  "scipy>=1.10,<2",
]

[project.optional-dependencies]
data = [
  "aiohttp>=3.9,<4",
  "feedparser>=6,<7",
  "fredapi>=0.5,<1",
  "newsapi-python>=0.2.7,<1",
  "requests>=2.31,<3",
  "schedule>=1.2,<2",
  "vaderSentiment>=3.3,<4",
  "yfinance>=0.2.40,<2",
]
boosted = [
  "lightgbm>=4,<5",
  "xgboost>=2,<4",
]
all = [
  "aiohttp>=3.9,<4",
  "feedparser>=6,<7",
  "fredapi>=0.5,<1",
  "lightgbm>=4,<5",
  "newsapi-python>=0.2.7,<1",
  "requests>=2.31,<3",
  "schedule>=1.2,<2",
  "vaderSentiment>=3.3,<4",
  "xgboost>=2,<4",
  "yfinance>=0.2.40,<2",
]
dev = [
  "build>=1.2,<2",
  "pip-audit>=2.7,<3",
  "twine>=6.1,<8",
]

[project.urls]
Homepage = "https://github.com/Aidan2111/carry-trade-model"
Repository = "https://github.com/Aidan2111/carry-trade-model"
Issues = "https://github.com/Aidan2111/carry-trade-model/issues"
Documentation = "https://github.com/Aidan2111/carry-trade-model#readme"
Changelog = "https://github.com/Aidan2111/carry-trade-model/blob/main/CHANGELOG.md"

[project.scripts]
carry-trade-api = "carry_trade.api.app:run_dev_server"
carry-trade-model = "carry_trade.modeling.runners.run_live_model:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
