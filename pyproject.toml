[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carry-trade-model"
version = "0.1.0"
description = "Research-grade carry trade model, data collectors, API, and dashboard integration."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aidan Marshall" }]
keywords = ["finance", "machine-learning", "research", "time-series", "foreign-exchange"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "aiohttp",
  "feedparser",
  "flask",
  "flask-cors",
  "fredapi",
  "lightgbm",
  "matplotlib",
  "newsapi-python",
  "numpy",
  "pandas",
  "python-dotenv",
  "requests",
  "schedule",
  "scikit-learn",
  "scipy",
  "vaderSentiment",
  "xgboost",
  "yfinance",
]

[project.urls]
Homepage = "https://github.com/Aidan2111/carry-trade-model"
Repository = "https://github.com/Aidan2111/carry-trade-model"
Issues = "https://github.com/Aidan2111/carry-trade-model/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
